rule-anchor:
  pr: &pr {type: select, proxies: [Static, Speed Test, Proxy, Hong Kong, Tai Wan, Singapore, Japan, Korea, United States, Direct]}
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: domain, format: text}

port: 8080
socks-port: 1080
mixed-port: 7890
redir-port: 7891
tproxy-port: 7892
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""

geox-url:
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "rule-set:fakeipfilter-cn,fakeipfilter-!cn,private-domain,steam@cn-domain,nintendo@cn-domain,xbox@cn-domain,microsoft@cn-domain,apple@cn-domain,cn-domain"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:fakeipfilter-cn,private-domain,steam@cn-domain,nintendo@cn-domain,xbox@cn-domain,microsoft@cn-domain,apple@cn-domain,cn-domain":
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter-!cn":
      - https://dns.google/dns-query#Static&disable-qtype-65=true
  nameserver:
    - https://dns.google/dns-query#Static&ecs=223.5.5.0/24
  fallback:
    - https://dns.google/dns-query#Static
  fallback-filter:
    geoip: true
    geoip-code: CN

proxy-providers:
  AirPort:
    url: "机场订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: Direct

proxies:
  - {name: "Direct", type: direct, udp: true}

proxy-groups:
  - {name: Static, type: select, proxies: [Speed Test, Proxy, Hong Kong, Tai Wan, Singapore, Japan, Korea, United States, Direct], icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png"}
  - {name: Speed Test, type: url-test, include-all: true, filter: "(?=.*(港|HK|(?i)Hong|台|TW|(?i)Tai|新|SG|(?i)Singapore|日|JP|(?i)Japan|韩|KR|(?i)Korea|美|US|(?i)States|America))", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"}
  - {name: Proxy, type: select, include-all: true, filter: "(?=.*)^((?!(网站|流量|地址|剩余|过期|免费|时间|有效|Traffic|ExpireDate|GB|Expire Date|Direct)).)*$", icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png"}
  - {name: AI, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png"}
  - {name: GitHub, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png"}
  - {name: OneDrive, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/OneDrive.png"}
  - {name: Telegram, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png"}
  - {name: TikTok, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok_1.png"}
  - {name: YouTube, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png"}
  - {name: Netflix, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png"}
  - {name: Spotify, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png"}
  - {name: Game, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png"}
  - {name: Google, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png"}
  - {name: Microsoft, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png"}
  - {name: Apple, <<: *pr, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_2.png"}
  - {name: Final, type: select, proxies: [Static, Proxy, Direct], icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png"}
  - {name: Hong Kong, type: url-test, include-all: true, filter: "(?=.*(港|HK|(?i)Hong))", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"}
  - {name: Tai Wan, type: url-test, include-all: true, filter: "(?=.*(台|TW|(?i)Tai))", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png"}
  - {name: Singapore, type: url-test, include-all: true, filter: "(?=.*(新|SG|(?i)Singapore))", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png"}
  - {name: Japan, type: url-test, include-all: true, filter: "(?=.*(日|JP|(?i)Japan))", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png"}
  - {name: Korea, type: url-test, include-all: true, filter: "(?=.*(韩|KR|(?i)Korea))", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png"}
  - {name: United States, type: url-test, include-all: true, filter: "(?=.*(美|US|(?i)States|America))", url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png"}
  - {name: GLOBAL, type: select, proxies: [Static, Speed Test, Proxy, AI, GitHub, OneDrive, Telegram, TikTok, YouTube, Netflix, Spotify, Game, Google, Microsoft, Apple, Final, Hong Kong, Tai Wan, Singapore, Japan, Korea, United States, Direct], icon: "https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png"}

